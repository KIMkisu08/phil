name: YouTubeDownloader release

# 태그 ytd-v* 를 푸시하면 Windows에서 YouTubeDownloader.exe를 빌드해
# GitHub Release에 올린다. PR과 수동 실행은 빌드만 하고 결과물을
# 아티팩트로 남긴다(릴리스는 만들지 않음).
on:
  push:
    tags: ["ytd-v*"]
  pull_request:
    paths:
      - "YouTubeDownloader/**"
      - ".github/workflows/youtube-downloader-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: YouTubeDownloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: YouTubeDownloader/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^ytd-v', ''
          if ($ver -notmatch '^\d+(\.\d+)*$') { throw "태그 형식은 ytd-v1.2.3 이어야 합니다: $env:TAG" }
          Set-Content -Encoding utf8 version.py "__version__ = `"$ver`""

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name YouTubeDownloader
          --icon icon.ico
          --add-data "icon.ico;."
          --collect-data customtkinter
          --collect-data yt_dlp_ejs
          --copy-metadata yt-dlp
          app.py

      - name: Package
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/YouTubeDownloader.exe release/
          Copy-Item 사용법.txt release/
          Compress-Archive -Path release/* -DestinationPath YouTubeDownloader_exe.zip -Force
          Get-FileHash dist/YouTubeDownloader.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  YouTubeDownloader.exe" } |
            Set-Content -Encoding ascii SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader
          path: |
            YouTubeDownloader/dist/YouTubeDownloader.exe
            YouTubeDownloader/YouTubeDownloader_exe.zip
            YouTubeDownloader/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create $env:TAG
          dist/YouTubeDownloader.exe YouTubeDownloader_exe.zip SHA256SUMS.txt
          --title "유튜브 음원 다운로더 $($env:TAG -replace '^ytd-v','')"
          --notes "YouTubeDownloader_exe.zip을 받아 압축을 풀고 YouTubeDownloader.exe를 실행하세요."
